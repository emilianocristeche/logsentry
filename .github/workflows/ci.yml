name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python analyzer.py                    # zero-dep self-check
      - run: pytest -q
      - run: python logsentry.py sample_auth.log || true   # demo run (exits 1 on findings)
